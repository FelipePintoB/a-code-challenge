<div class="single-select-container">
  <label for="state-select">{{ label }}</label>
  <select
    [id]="id"
    [value]="value"
    [disabled]="disabled"
    (change)="onSelectionChange($event)"
    (blur)="onBlur()"
    class="form-select"
  >
    @for (option of options; track $index) {
    <option [value]="option.value">{{ option.name }}</option>
    }
  </select>
</div>
