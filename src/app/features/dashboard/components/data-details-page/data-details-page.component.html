<div class="dashboard-container">
  <div class="dashboard-header-container">
    <h1>Dashboard</h1>
    <button type="button" class="btn-secondary" (click)="goBack()">Back</button>
  </div>

  <div class="user-info-container">
    <h2>User Information</h2>
    <div class="card info-grid">
      <div class="info-item">
        <label class="item-label">Name:</label>
        <span>{{ dashboardDataService.$state().name || "Not set" }}</span>
      </div>
      <div class="info-item">
        <label class="item-label">Email:</label>
        <span>{{ dashboardDataService.$state().email || "Not set" }}</span>
      </div>
      <div class="info-item">
        <label class="item-label">Subscription:</label>
        <span>{{
          dashboardDataService.$state().subscription || "Not set"
        }}</span>
      </div>
      <div class="info-item">
        <label class="item-label">Password:</label>
        <span>{{
          dashboardDataService.$state().password ? "••••••••" : "Not set"
        }}</span>
      </div>
    </div>
  </div>

  <app-data-details-table />
</div>
