<form class="form-container" [formGroup]="dataForm" (submit)="submitHandler()">
  @if(hasFormErrors) {
  <app-data-form-errors [dataForm]="dataForm"></app-data-form-errors>
  }
  <div class="input-container">
    <app-primary-text-input
      [label]="'First and Last Name'"
      [placeholder]="'Input first and last name'"
      [type]="'text'"
      [errorMessage]="getErrorWarn('name')"
      formControlName="name"
      [control]="getControl('name')"
    ></app-primary-text-input>
    <app-primary-text-input
      [label]="'Email'"
      [placeholder]="'Input email'"
      [type]="'email'"
      [errorMessage]="getErrorWarn('email')"
      formControlName="email"
      [control]="getControl('email')"
    ></app-primary-text-input>
    <app-single-select
      [label]="'Subscription'"
      [options]="subscriptionOptions"
      [initSelectedValue]="initSubscriptionOption"
      formControlName="subscription"
      [control]="getControl('subscription')"
    ></app-single-select>
    <app-primary-text-input
      [label]="'Password'"
      [placeholder]="'Input password'"
      [type]="'password'"
      [errorMessage]="getErrorWarn('password')"
      formControlName="password"
      [control]="getControl('password')"
    ></app-primary-text-input>
    <app-file-input
      [groupName]="'file'"
      [buttonLabel]="'Upload File'"
    ></app-file-input>
  </div>
  <div class="button-container">
    <app-clear-form-button
      (clearHandler)="clearHandler()"
      [isDirty]="isFormDirty"
    />
    <button class="btn-primary" type="submit">Submit</button>
  </div>
</form>
